<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      SEO / Social
      Vor dem Deployment anpassen: Titel, Description, Domain (canonical + og:url),
      og:image. Die Domain steht zusaetzlich in src/data/site.ts.
    -->
    <title>Artur Renner — Designer &amp; Developer</title>
    <meta
      name="description"
      content="Portfolio von Artur Renner — Designer und Developer für durchdachte digitale Interfaces, Produkte und Datenvisualisierung."
    />
    <meta name="author" content="Artur Renner" />
    <link rel="canonical" href="https://pleonastic6.github.io/Portfolio/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Artur Renner" />
    <meta property="og:title" content="Artur Renner — Designer &amp; Developer" />
    <meta
      property="og:description"
      content="Designer und Developer für durchdachte digitale Interfaces, Produkte und Datenvisualisierung."
    />
    <meta property="og:url" content="https://pleonastic6.github.io/Portfolio/" />
    <meta property="og:image" content="https://pleonastic6.github.io/Portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Artur Renner — Designer &amp; Developer" />
    <meta
      name="twitter:description"
      content="Designer und Developer für durchdachte digitale Interfaces, Produkte und Datenvisualisierung."
    />
    <meta name="twitter:image" content="https://pleonastic6.github.io/Portfolio/og-image.png" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
