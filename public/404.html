<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Artur Renner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Bewusst eigenstaendig: keine gehashten Assets, damit die Seite auch
         dann noch traegt, wenn der Build danebenliegt. Werte gespiegelt aus
         src/styles/tokens.css. */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2rem;
        padding: clamp(1.5rem, 6vw, 5rem);
        background: #080807;
        color: #f4efe4;
        font-family: Georgia, 'Times New Roman', serif;
        -webkit-font-smoothing: antialiased;
      }
      .label {
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #9b9488;
      }
      h1 {
        font-size: clamp(2.5rem, 9vw, 6rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        max-width: 18ch;
      }
      .rule {
        height: 1px;
        background: rgb(244 239 228 / 0.11);
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.6em;
        width: fit-content;
        color: #f4efe4;
        text-decoration: none;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding-bottom: 0.35em;
        border-bottom: 1px solid rgb(244 239 228 / 0.24);
      }
      a:hover {
        border-bottom-color: #f4efe4;
      }
    </style>
  </head>
  <body>
    <p class="label">Fehler 404 — Seite nicht gefunden</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <div class="rule"></div>
    <a id="home" href="/"><span aria-hidden="true">←</span> Zur Startseite</a>

    <script>
      // Auf GitHub-Projektseiten liegt die Startseite unter /<repo>/,
      // auf einer eigenen Domain unter /. Beides hier abfangen.
      var parts = location.pathname.split('/').filter(Boolean)
      var onGithub = location.hostname.endsWith('github.io')
      document.getElementById('home').href = onGithub && parts.length ? '/' + parts[0] + '/' : '/'
    </script>
  </body>
</html>
